name: clash-box

services:
  mihomo:
    image: metacubex/mihomo:${MIHOMO_VERSION:-v1.19.33}
    restart: unless-stopped
    command: ["-d", "/root/.config/mihomo", "-f", "/etc/mihomo/config.yaml"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${PROXY_BIND_IP:-0.0.0.0}:${MIXED_PORT:-7890}:7890/tcp"
      - "${PROXY_BIND_IP:-0.0.0.0}:${SOCKS_PORT:-7891}:7891/tcp"
    volumes:
      - type: bind
        source: ./config/config.yaml
        target: /etc/mihomo/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: mihomo-data
        target: /root/.config/mihomo
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mihomo-data:
